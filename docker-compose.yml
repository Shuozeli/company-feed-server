services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_feed}
      POSTGRES_USER: ${POSTGRES_USER:-company_feed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company_feed}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  schema:
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    entrypoint: ["pg-schema-diff"]
    command:
      - apply
      - --from-empty-dsn
      - --to-dir
      - /app/schema
      - --include-schema
      - public
      - --skip-confirm-prompt
      - --allow-hazards
      - ${SCHEMA_ALLOW_HAZARDS:-INDEX_BUILD,HAS_UNTRACKABLE_DEPENDENCIES}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-company_feed}
      PGUSER: ${POSTGRES_USER:-company_feed}
      PGPASSWORD: ${POSTGRES_PASSWORD:-company_feed}
      PGSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_feed}:${POSTGRES_PASSWORD:-company_feed}@postgres:5432/${POSTGRES_DB:-company_feed}
      RUST_LOG: ${RUST_LOG:-info,feed_server=debug}
      PUBLIC_FETCH_USER_AGENT: ${PUBLIC_FETCH_USER_AGENT:-CompanyFeedServer/0.1 (+https://github.com/Shuozeli/company-feed-server)}
      BIND_ADDR: 0.0.0.0:8080
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      COMPANIES_CONFIG: ${COMPANIES_CONFIG:-/app/configs/companies.yaml}
      EXPORT_TARGETS_CONFIG: ${EXPORT_TARGETS_CONFIG:-/app/configs/export_targets.yaml}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - ./configs:/app/configs:ro
      - export-data:/app/exports
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    profiles: ["workers"]
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    entrypoint: ["feed-worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_feed}:${POSTGRES_PASSWORD:-company_feed}@postgres:5432/${POSTGRES_DB:-company_feed}
      RUST_LOG: ${RUST_LOG:-info,feed_worker=debug}
      PUBLIC_FETCH_USER_AGENT: ${PUBLIC_FETCH_USER_AGENT:-CompanyFeedServer/0.1 (+https://github.com/Shuozeli/company-feed-server)}
      WORKER_BIND_ADDR: 0.0.0.0:8081
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      RUN_JOBS: ${WORKER_RUN_JOBS:-true}
      SCHEDULE_JOBS: ${WORKER_SCHEDULE_JOBS:-true}
      COMPANIES_CONFIG: ${COMPANIES_CONFIG:-/app/configs/companies.yaml}
      EXPORT_TARGETS_CONFIG: ${EXPORT_TARGETS_CONFIG:-/app/configs/export_targets.yaml}
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8081"
    volumes:
      - ./configs:/app/configs:ro
      - export-data:/app/exports
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  payload-offloader:
    profiles: ["workers"]
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    entrypoint: ["feed-payload-offloader"]
    # Host networking: the offloader must reach the NAS MinIO over Tailscale
    # (a docker bridge cannot route to a Tailscale peer), and it talks to
    # Postgres via the host-published port. Do not add `ports:` under host mode.
    network_mode: host
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_feed}:${POSTGRES_PASSWORD:-company_feed}@127.0.0.1:${POSTGRES_PORT:-55432}/${POSTGRES_DB:-company_feed}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://ugreen-nas-dxp4800pro-yuacx.tail8f3b66.ts.net:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-nas-minio}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-e9d2c4f9093adea8d659e62a0917624d53479b32745c6a7c}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RAW_CRAWL_BUCKET: ${RAW_CRAWL_BUCKET:-company-feed-crawl-raw}
      OFFLOAD_CONTINUOUS: "true"
      OFFLOAD_BATCH_SIZE: ${OFFLOAD_BATCH_SIZE:-2000}
      OFFLOAD_CONCURRENCY: ${OFFLOAD_CONCURRENCY:-4}
      OFFLOAD_DB_POOL: ${OFFLOAD_DB_POOL:-8}
      OFFLOAD_IDLE_SLEEP_SECS: ${OFFLOAD_IDLE_SLEEP_SECS:-60}
      RUST_LOG: ${RUST_LOG:-warn,feed_payload_offloader=info}
    depends_on:
      schema:
        condition: service_completed_successfully
    restart: unless-stopped

  discovery-worker:
    profiles: ["discovery"]
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    entrypoint: ["feed-discovery-worker"]
    # Tailscale's container-safe DNS resolver lets this worker reach a private
    # adapter by MagicDNS name without embedding the adapter's address here.
    dns:
      - 100.100.100.100
      - 1.1.1.1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_feed}:${POSTGRES_PASSWORD:-company_feed}@postgres:5432/${POSTGRES_DB:-company_feed}
      RUST_LOG: ${RUST_LOG:-info,feed_discovery_worker=debug}
      PUBLIC_FETCH_USER_AGENT: ${PUBLIC_FETCH_USER_AGENT:-CompanyFeedServer/0.1 (+https://github.com/Shuozeli/company-feed-server)}
      DISCOVERY_WORKER_BIND_ADDR: 0.0.0.0:8082
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      RUN_JOBS: ${DISCOVERY_RUN_JOBS:-true}
      SCHEDULE_JOBS: ${DISCOVERY_SCHEDULE_JOBS:-true}
      DISCOVERY_QUEUE_TARGET: ${DISCOVERY_QUEUE_TARGET:-100}
      COMPANIES_CONFIG: ${COMPANIES_CONFIG:-/app/configs/companies.yaml}
      EXPORT_TARGETS_CONFIG: ${EXPORT_TARGETS_CONFIG:-/app/configs/export_targets.yaml}
      WEB_DISCOVERY_ADAPTER_MODE: ${WEB_DISCOVERY_ADAPTER_MODE:-disabled}
      WEB_DISCOVERY_ADAPTER_URL: ${WEB_DISCOVERY_ADAPTER_URL:-}
      WEB_DISCOVERY_ADAPTER_TOKEN: ${WEB_DISCOVERY_ADAPTER_TOKEN:-}
      WEB_DISCOVERY_ADAPTER_TIMEOUT_SECONDS: ${WEB_DISCOVERY_ADAPTER_TIMEOUT_SECONDS:-90}
      WEB_DISCOVERY_ADAPTER_MAX_RESPONSE_BYTES: ${WEB_DISCOVERY_ADAPTER_MAX_RESPONSE_BYTES:-1048576}
      WEB_DISCOVERY_ADAPTER_MAX_CANDIDATES: ${WEB_DISCOVERY_ADAPTER_MAX_CANDIDATES:-20}
      DISCOVERY_ALLOW_PRIVATE_NETWORKS: ${DISCOVERY_ALLOW_PRIVATE_NETWORKS:-false}
    ports:
      - "127.0.0.1:${DISCOVERY_WORKER_PORT:-8082}:8082"
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  validation-worker:
    profiles: ["validation"]
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    entrypoint: ["feed-validation-worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_feed}:${POSTGRES_PASSWORD:-company_feed}@postgres:5432/${POSTGRES_DB:-company_feed}
      RUST_LOG: ${RUST_LOG:-info,feed_validation_worker=debug}
      PUBLIC_FETCH_USER_AGENT: ${PUBLIC_FETCH_USER_AGENT:-CompanyFeedServer/0.1 (+https://github.com/Shuozeli/company-feed-server)}
      VALIDATION_WORKER_BIND_ADDR: 0.0.0.0:8083
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      RUN_JOBS: ${VALIDATION_RUN_JOBS:-true}
      SCHEDULE_JOBS: ${VALIDATION_SCHEDULE_JOBS:-false}
      VALIDATION_QUEUE_TARGET: ${VALIDATION_QUEUE_TARGET:-100}
      VALIDATION_AUTO_ACTIVATE: ${VALIDATION_AUTO_ACTIVATE:-true}
      VALIDATION_PUBLIC_EXPORT: ${VALIDATION_PUBLIC_EXPORT:-false}
      VALIDATION_ACTIVATION_POLICY: ${VALIDATION_ACTIVATION_POLICY:-strict}
      VALIDATION_MAX_ITEM_AGE_DAYS: ${VALIDATION_MAX_ITEM_AGE_DAYS:-730}
      AUTO_ACTIVATION_FRESHNESS_SECONDS: ${AUTO_ACTIVATION_FRESHNESS_SECONDS:-3600}
    ports:
      - "127.0.0.1:${VALIDATION_WORKER_PORT:-8083}:8083"
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  news-extraction-worker:
    profiles: ["news-extraction"]
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    entrypoint: ["feed-news-extraction-worker"]
    dns:
      - 100.100.100.100
      - 1.1.1.1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_feed}:${POSTGRES_PASSWORD:-company_feed}@postgres:5432/${POSTGRES_DB:-company_feed}
      RUST_LOG: ${RUST_LOG:-info,feed_news_extraction_worker=debug}
      PUBLIC_FETCH_USER_AGENT: ${PUBLIC_FETCH_USER_AGENT:-CompanyFeedServer/0.1 (+https://github.com/Shuozeli/company-feed-server)}
      NEWS_EXTRACTION_WORKER_BIND_ADDR: 0.0.0.0:8084
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      RUN_JOBS: ${NEWS_EXTRACTION_RUN_JOBS:-true}
      NEWS_EXTRACTION_RUN_JOBS: ${NEWS_EXTRACTION_RUN_JOBS:-true}
      NEWS_EXTRACTION_JOB_CONCURRENCY: ${NEWS_EXTRACTION_JOB_CONCURRENCY:-1}
      NEWS_EXTRACTION_ENABLED: ${NEWS_EXTRACTION_ENABLED:-false}
      NEWS_EXTRACTION_SOURCE_FRESHNESS_SECONDS: ${NEWS_EXTRACTION_SOURCE_FRESHNESS_SECONDS:-2592000}
      NEWS_EXTRACTION_ADAPTER_URL: ${NEWS_EXTRACTION_ADAPTER_URL:-}
      NEWS_EXTRACTION_ADAPTER_TOKEN: ${NEWS_EXTRACTION_ADAPTER_TOKEN:-}
      NEWS_EXTRACTION_ADAPTER_TIMEOUT_SECONDS: ${NEWS_EXTRACTION_ADAPTER_TIMEOUT_SECONDS:-750}
      NEWS_EXTRACTION_ADAPTER_MAX_RESPONSE_BYTES: ${NEWS_EXTRACTION_ADAPTER_MAX_RESPONSE_BYTES:-1048576}
      NEWS_EXTRACTION_MAX_ARTICLES: ${NEWS_EXTRACTION_MAX_ARTICLES:-20}
      NEWS_EXTRACTION_FETCH_TIMEOUT_SECONDS: ${NEWS_EXTRACTION_FETCH_TIMEOUT_SECONDS:-20}
      NEWS_EXTRACTION_MAX_RESPONSE_BYTES: ${NEWS_EXTRACTION_MAX_RESPONSE_BYTES:-8388608}
      NEWS_EXTRACTION_MAX_CONCURRENCY: ${NEWS_EXTRACTION_MAX_CONCURRENCY:-24}
      NEWS_EXTRACTION_MAX_PER_HOST_CONCURRENCY: ${NEWS_EXTRACTION_MAX_PER_HOST_CONCURRENCY:-8}
      NEWS_EXTRACTION_MIN_CONTENT_CHARS: ${NEWS_EXTRACTION_MIN_CONTENT_CHARS:-200}
      NEWS_EXTRACTION_ALLOW_PRIVATE_NETWORKS: ${NEWS_EXTRACTION_ALLOW_PRIVATE_NETWORKS:-false}
      NEWS_EXTRACTION_PUBLIC_EXPORT: ${NEWS_EXTRACTION_PUBLIC_EXPORT:-false}
      COMPANIES_CONFIG: ${COMPANIES_CONFIG:-/app/configs/companies.yaml}
      EXPORT_TARGETS_CONFIG: ${EXPORT_TARGETS_CONFIG:-/app/configs/export_targets.yaml}
    ports:
      - "127.0.0.1:${NEWS_EXTRACTION_WORKER_PORT:-8084}:8084"
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  content-worker:
    profiles: ["content-crawl"]
    image: ${COMPANY_FEED_IMAGE:-company-feed-server:local}
    build:
      context: .
    entrypoint: ["feed-content-worker"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-company_feed}:${POSTGRES_PASSWORD:-company_feed}@postgres:5432/${POSTGRES_DB:-company_feed}
      RUST_LOG: ${RUST_LOG:-info,feed_content_worker=debug}
      PUBLIC_FETCH_USER_AGENT: ${PUBLIC_FETCH_USER_AGENT:-CompanyFeedServer/0.1 (+https://github.com/Shuozeli/company-feed-server)}
      CONTENT_CRAWL_WORKER_BIND_ADDR: 0.0.0.0:8085
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      CONTENT_CRAWL_ENABLED: ${CONTENT_CRAWL_ENABLED:-true}
      CONTENT_CRAWL_RUN_JOBS: ${CONTENT_CRAWL_RUN_JOBS:-true}
      CONTENT_CRAWL_JOB_CONCURRENCY: ${CONTENT_CRAWL_JOB_CONCURRENCY:-1}
      CONTENT_CRAWL_BATCH_SIZE: ${CONTENT_CRAWL_BATCH_SIZE:-100}
      CONTENT_CRAWL_FETCH_TIMEOUT_SECONDS: ${CONTENT_CRAWL_FETCH_TIMEOUT_SECONDS:-20}
      CONTENT_CRAWL_MAX_RESPONSE_BYTES: ${CONTENT_CRAWL_MAX_RESPONSE_BYTES:-8388608}
      CONTENT_CRAWL_MAX_CONCURRENCY: ${CONTENT_CRAWL_MAX_CONCURRENCY:-24}
      CONTENT_CRAWL_MAX_PER_HOST_CONCURRENCY: ${CONTENT_CRAWL_MAX_PER_HOST_CONCURRENCY:-2}
      CONTENT_CRAWL_MIN_CONTENT_CHARS: ${CONTENT_CRAWL_MIN_CONTENT_CHARS:-200}
      CONTENT_CRAWL_REFRESH_SECONDS: ${CONTENT_CRAWL_REFRESH_SECONDS:-2592000}
      CONTENT_CRAWL_MAX_ATTEMPTS: ${CONTENT_CRAWL_MAX_ATTEMPTS:-5}
      COMPANIES_CONFIG: ${COMPANIES_CONFIG:-/app/configs/companies.yaml}
      EXPORT_TARGETS_CONFIG: ${EXPORT_TARGETS_CONFIG:-/app/configs/export_targets.yaml}
    ports:
      - "127.0.0.1:${CONTENT_CRAWL_WORKER_PORT:-8085}:8085"
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  export-data:
