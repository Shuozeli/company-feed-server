services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: company_feed
      POSTGRES_USER: company_feed
      POSTGRES_PASSWORD: company_feed
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_feed -d company_feed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

